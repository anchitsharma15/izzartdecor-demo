<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2e101f">
  <title>Under maintenance | IzzartDecor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background: radial-gradient(ellipse at 50% 28%, #512939, #2e101f 70%);
      color: #fff8ef;
      font: 1rem/1.6 system-ui, sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 36rem);
      padding: clamp(2rem, 8vw, 5rem) 1.5rem;
      border: 1px solid #d4b68360;
    }
    .brand {
      margin: 0;
      color: #d4b683;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 1.25rem 0 0.75rem;
      font: 400 clamp(2.4rem, 8vw, 4.25rem)/1.05 Georgia, serif;
    }
    .message { margin: 0; color: #ead9dc; }
  </style>
</head>
<body>
  <main>
    <p class="brand">IzzartDecor</p>
    <h1>Under maintenance</h1>
    <p class="message">We're making updates. Please check back soon.</p>
  </main>
</body>
</html>
